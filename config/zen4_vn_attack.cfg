# zen4_vn_attack.cfg — Attack scenario configuration for Weaponizing Version Locality
#
# Inherits the full Toleo stack (zen4_vn): CXL memory, VN server, AES encryption.
# No structural changes are needed — contention arises naturally because all cores
# share one CXLVNPerfModel queue (bandwidth = 3.32 GB/s).
#
# The key resource under attack is:
#   [perf_model/cxl/vnserver] bandwidth = 3.32 GB/s
#
# When the attacker pushes pages into OVERFLOW state, each VN_UPDATE triggers
# 32 sequential 16-byte DRAM reads over this shared bus. At peak attack load,
# the bus is monopolized and victim VN_UPDATE requests stall in the queue.
#
# Key stats to observe in sim.out:
#   vv[0].vault-to-overflow      — VAULT→OVERFLOW transitions (locality destroyed)
#   vv[0].overflow-penalty-iters — total 32-loop DRAM iterations (= amplified traffic)
#   mee[i].vn-evictions          — VN table evictions (Overflow Buffer pressure proxy)
#   cxl[i].total-effective-read-latency — victim read latency (DoS impact)

#include zen4_vn

# Reduce VN table to 64 entries to accelerate eviction pressure during attack.
# The paper's 28 KB Overflow Buffer is modeled here via aggressive evictions.
# (Comment out to use default 256 entries for a more conservative demonstration.)
[perf_model/mee/vn_table]
entries = 64
