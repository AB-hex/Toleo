# zen4_vn_throttle.cfg — Run E: Toleo with dynamic per-tenant VN_UPDATE throttling.
#
# Inherits the full zen4_vn (Toleo) configuration and only adds the throttle.
# All other knobs identical to Run C, so any difference between Run C and Run E
# is attributable solely to the throttle.

#include zen4_vn

[perf_model/cxl/vnserver/throttle]
# Token-bucket rate limiter on VN_UPDATEs at the cxl_id=1 device front-end.
# Reads (VN_READ) are NOT throttled — benign read-heavy workloads are unaffected.
enable = true

# Updates allowed per microsecond per requester core.
# Sniper-Toleo's idle-Toleo workload generates VN_UPDATEs at roughly the rate
# of dirty-line evictions. The attacker (sparse_writer) sustains ~36 VN_UPDATEs
# per microsecond per core under attack (324K updates / ~9 ms simulated).
# Setting the cap at 5 updates/μs/core throttles the attacker to ~1/7 of its
# unconstrained rate, while leaving headroom for normal write-heavy workloads.
rate_per_us_per_core = 5
